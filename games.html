<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HeroGames">
<title>HeroGames — ألعاب ممتعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0F1A;
  --bg2:#16162A;
  --surface:#1C1C33;
  --surface2:#252545;
  --text:#FFFFFF;
  --muted:#9A9AB5;
  --line:rgba(255,255,255,.08);
  --primary:#F59E0B;
  --primary2:#FBBF24;
  --accent:#22C55E;
  --accent2:#16A34A;
  --danger:#EF4444;
  --radius:18px;
  --radius-sm:14px;
  --header-h:64px;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic','Poppins',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body{
  background:
    radial-gradient(900px 500px at 90% -10%,rgba(245,158,11,.16),transparent 60%),
    radial-gradient(700px 500px at 10% 20%,rgba(139,92,246,.14),transparent 60%),
    radial-gradient(700px 500px at 50% 120%,rgba(34,197,94,.10),transparent 60%),
    var(--bg);
  padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;font-family:inherit}
[hidden]{display:none !important}
.container{width:100%;max-width:640px;margin-inline:auto;padding-inline:18px}

/* ============ SPLASH ============ */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,#0F0F1A 0%,#1E1B3A 50%,#3A1F5C 100%);
  display:grid;place-items:center;
  transition:opacity .5s,visibility .5s;
}
#splash.hide{opacity:0;visibility:hidden}
.splash-logo{
  text-align:center;animation:pop .8s cubic-bezier(.2,.8,.2,1);
}
.splash-logo .mark{
  width:96px;height:96px;border-radius:26px;margin:0 auto 16px;
  background:linear-gradient(135deg,#F59E0B,#FBBF24);
  display:grid;place-items:center;font-size:52px;
  box-shadow:0 24px 60px rgba(245,158,11,.5);
}
.splash-logo h1{
  margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(135deg,#F59E0B,#FBBF24);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.splash-logo p{margin:6px 0 0;font-size:13px;color:rgba(255,255,255,.6);letter-spacing:2px}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

/* ============ HEADER ============ */
.app-header{
  position:sticky;top:0;z-index:60;
  background:rgba(15,15,26,.82);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.header-inner{
  height:var(--header-h);display:flex;align-items:center;gap:12px;
}
.app-logo{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,#F59E0B,#FBBF24);
  display:grid;place-items:center;font-size:20px;
  box-shadow:0 8px 20px rgba(245,158,11,.4);
  flex-shrink:0;overflow:hidden;
}
.app-logo img{width:100%;height:100%;object-fit:cover}
.app-name{font-weight:800;font-size:17px;line-height:1.1;flex:1}
.app-name small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:2px;font-weight:600;margin-top:2px}
.search-btn{
  width:42px;height:42px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center;font-size:18px;
  transition:.2s;
}
.search-btn:active{transform:scale(.94);background:var(--surface2)}

/* search bar */
.search-bar{
  height:0;overflow:hidden;transition:height .3s;
  border-top:1px solid transparent;
}
.search-bar.open{height:56px;border-top-color:var(--line)}
.search-bar-inner{padding:10px 0;display:flex;gap:8px}
.search-bar input{
  flex:1;height:38px;padding:0 14px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);color:var(--text);
  outline:none;font-size:14px;
}
.search-bar input:focus{border-color:var(--primary)}

/* ============ FEATURED HERO ============ */
.hero-featured{
  margin-top:18px;
  position:relative;border-radius:24px;overflow:hidden;
  min-height:200px;
  background:linear-gradient(135deg,var(--c1,#F59E0B),var(--c2,#FBBF24));
  display:flex;flex-direction:column;justify-content:space-between;
  padding:20px;cursor:pointer;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  transition:transform .25s;
}
.hero-featured:active{transform:scale(.98)}
.hero-featured img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;
}
.hero-featured::after{
  content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.2) 55%,transparent 100%);
}
.hero-featured > *{position:relative;z-index:2}
.hero-badge{
  display:inline-flex;align-items:center;gap:5px;align-self:flex-start;
  background:rgba(255,255,255,.2);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.25);
  padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;
  color:#fff;
}
.hero-info{display:flex;flex-direction:column;gap:6px;color:#fff}
.hero-title{font-size:22px;font-weight:800;margin:0;line-height:1.25;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.hero-meta{display:flex;gap:12px;align-items:center;font-size:12.5px;opacity:.92;font-weight:600}
.hero-play{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:44px;padding:0 26px;border-radius:12px;align-self:flex-start;
  background:linear-gradient(135deg,#F59E0B,#FBBF24);color:#0F0F1A;
  font-weight:800;font-size:14.5px;margin-top:8px;
  box-shadow:0 10px 24px rgba(245,158,11,.5);
  transition:.2s;
}
.hero-play:active{transform:scale(.96)}

/* ============ SECTION ============ */
.section{margin-top:26px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.section-head h2{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:7px}
.section-head .more{font-size:12.5px;color:var(--primary);font-weight:700;cursor:pointer}

/* ============ CATEGORIES CHIPS ============ */
.cats-scroll{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-18px;padding-inline:18px;
  scrollbar-width:none;
}
.cats-scroll::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);
  transition:.2s;white-space:nowrap;
}
.chip:active{transform:scale(.96)}
.chip.active{
  background:linear-gradient(135deg,#F59E0B,#FBBF24);color:#0F0F1A;border-color:transparent;
  box-shadow:0 6px 16px rgba(245,158,11,.35);
}

/* ============ GAMES GRID ============ */
.games-grid{
  display:grid;gap:12px;
  grid-template-columns:repeat(2,1fr);
}
.game-card{
  background:var(--surface);border-radius:var(--radius-sm);
  border:1px solid var(--line);overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .25s,box-shadow .25s,border-color .25s;
  cursor:pointer;
}
.game-card:active{transform:scale(.97)}
.game-cover{
  position:relative;aspect-ratio:16/10;overflow:hidden;
  background:linear-gradient(135deg,var(--c1,#F59E0B),var(--c2,#FBBF24));
  display:grid;place-items:center;
}
.game-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.game-emoji{font-size:44px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));z-index:0}
.game-badge{
  position:absolute;top:8px;right:8px;z-index:2;
  background:rgba(0,0,0,.65);backdrop-filter:blur(6px);
  color:#fff;font-size:10px;font-weight:800;
  padding:3px 9px;border-radius:999px;
  border:1px solid rgba(255,255,255,.2);
}
.game-badge.new{background:rgba(34,197,94,.9)}
.game-badge.hot{background:rgba(239,68,68,.9)}
.game-body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.game-title{font-size:14px;font-weight:800;margin:0;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;color:#fff}
.game-stats{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);font-weight:600}
.game-stats span{display:inline-flex;align-items:center;gap:4px}
.game-stats .star{color:#FBBF24}
.play-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:38px;border-radius:11px;margin-top:4px;
  background:linear-gradient(135deg,#22C55E,#16A34A);
  color:#fff;font-weight:800;font-size:13.5px;
  box-shadow:0 6px 14px rgba(34,197,94,.35);
  transition:.2s;
}
.play-btn:active{transform:scale(.96)}

/* ============ TOP GAMES (horizontal) ============ */
.top-scroll{
  display:flex;gap:14px;overflow-x:auto;
  margin-inline:-18px;padding-inline:18px;padding-bottom:6px;
  scrollbar-width:none;
}
.top-scroll::-webkit-scrollbar{display:none}
.top-card{
  flex-shrink:0;width:200px;
  background:var(--surface);border-radius:var(--radius-sm);overflow:hidden;
  border:1px solid var(--line);cursor:pointer;
  transition:transform .2s;
}
.top-card:active{transform:scale(.96)}
.top-card .game-cover{aspect-ratio:1/1}

/* ============ EMPTY ============ */
.empty{
  text-align:center;padding:60px 20px;color:var(--muted);
}
.empty .big{font-size:52px;margin-bottom:12px;opacity:.5}
.empty h3{color:var(--text);font-size:17px;margin:0 0 6px}

/* ============ LOADING ============ */
.loading{
  text-align:center;padding:40px 0;color:var(--muted);
  font-size:13.5px;font-weight:600;
}
.spinner{
  width:32px;height:32px;margin:0 auto 14px;
  border:3px solid rgba(255,255,255,.12);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ GAME DETAIL ============ */
.game-detail{padding-top:20px}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13.5px;font-weight:700;color:var(--muted);
  padding:8px 12px;border-radius:10px;background:var(--surface);
  border:1px solid var(--line);margin-bottom:16px;
}
.back-btn:active{transform:scale(.96)}
.detail-cover{
  position:relative;aspect-ratio:16/10;border-radius:20px;overflow:hidden;
  background:linear-gradient(135deg,var(--c1,#F59E0B),var(--c2,#FBBF24));
  display:grid;place-items:center;font-size:80px;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
  margin-bottom:18px;
}
.detail-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.detail-title{font-size:24px;font-weight:800;margin:0 0 8px}
.detail-meta{display:flex;gap:14px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:16px}
.detail-desc{font-size:14.5px;line-height:1.85;color:#D0D0E0;margin-bottom:20px}
.detail-info{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px;margin-bottom:16px;
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
}
.info-item .lbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.info-item .val{font-size:15px;font-weight:800;margin-top:2px}
.big-play{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:56px;border-radius:16px;
  background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff;
  font-weight:800;font-size:17px;
  box-shadow:0 14px 30px rgba(34,197,94,.4);
  transition:.2s;
}
.big-play:active{transform:scale(.97)}

/* ============ BOTTOM BAR ============ */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:70;
  background:rgba(15,15,26,.94);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  display:flex;gap:4px;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;border-radius:12px;font-size:10.5px;font-weight:700;
  color:var(--muted);transition:.2s;
}
.nav-item .ico{font-size:20px;line-height:1}
.nav-item.active{color:var(--primary)}
.nav-item:active{transform:scale(.94)}

/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:96px;left:50%;transform:translate(-50%,150%);
  background:#fff;color:#0F0F1A;padding:11px 20px;border-radius:12px;
  font-size:13.5px;font-weight:700;z-index:120;
  transition:transform .3s;box-shadow:0 14px 40px rgba(0,0,0,.5);
  max-width:90vw;text-align:center;
}
.toast.show{transform:translate(-50%,0)}

/* ============ RESPONSIVE ============ */
@media(min-width:520px){
  .games-grid{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:720px){
  .container{max-width:760px}
  .games-grid{grid-template-columns:repeat(4,1fr)}
  .top-card{width:220px}
}
</style>
</head>
<body>

<!-- ============ SPLASH ============ -->
<div id="splash">
  <div class="splash-logo">
    <div class="mark" id="splash-mark">🎮</div>
    <h1 id="splash-title">HeroGames</h1>
    <p id="splash-tag">LOADING...</p>
  </div>
</div>

<!-- ============ HEADER ============ -->
<header class="app-header">
  <div class="container header-inner">
    <div class="app-logo" id="app-logo">🎮</div>
    <div class="app-name">
      <span id="app-name">HeroGames</span>
      <small id="app-tag">GAMES</small>
    </div>
    <button class="search-btn" id="search-btn" aria-label="بحث">🔍</button>
  </div>
  <div class="container search-bar" id="search-bar">
    <div class="search-bar-inner">
      <input type="search" id="search-input" placeholder="ابحث عن لعبة...">
    </div>
  </div>
</header>

<!-- ============ MAIN ============ -->
<main class="container">

  <!-- VIEW: HOME -->
  <section id="view-home">
    <!-- Featured Hero -->
    <div id="featured-slot"></div>

    <!-- Categories -->
    <section class="section">
      <div class="cats-scroll" id="cats-slot"></div>
    </section>

    <!-- Top Games -->
    <section class="section" id="top-section">
      <div class="section-head">
        <h2>🔥 الأكثر لعبًا</h2>
      </div>
      <div class="top-scroll" id="top-slot"></div>
    </section>

    <!-- All Games -->
    <section class="section">
      <div class="section-head">
        <h2>🎮 كل الألعاب</h2>
        <span class="more" id="games-count"></span>
      </div>
      <div class="games-grid" id="games-slot"></div>
    </section>
  </section>

  <!-- VIEW: SEARCH -->
  <section id="view-search" hidden>
    <div class="section-head">
      <h2>🔍 نتائج البحث</h2>
      <span class="more" id="search-count"></span>
    </div>
    <div class="games-grid" id="search-slot"></div>
  </section>

  <!-- VIEW: GAME DETAIL -->
  <section id="view-game" hidden>
    <div id="game-detail-slot"></div>
  </section>

</main>

<!-- ============ BOTTOM BAR ============ -->
<nav class="bottom-bar">
  <div class="nav-item active" data-nav="home">
    <span class="ico">🏠</span>
    <span>الرئيسية</span>
  </div>
  <div class="nav-item" data-nav="top">
    <span class="ico">🔥</span>
    <span>الأكثر</span>
  </div>
  <div class="nav-item" data-nav="search">
    <span class="ico">🔍</span>
    <span>بحث</span>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script src="games.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   HELPERS
   ============================================================ */
function $(s,c){ return (c||document).querySelector(s); }
function $$(s,c){ return Array.prototype.slice.call((c||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];}); }
function toast(msg){ var t=$('#toast'); if(!t)return; t.textContent=msg; t.classList.add('show'); clearTimeout(t._id); t._id=setTimeout(function(){t.classList.remove('show');},2200); }

/* ============================================================
   STATE
   ============================================================ */
var D = window.HERO_GAMES || { games: [], categories: [], settings: {} };
var STATE = {
  games: D.games || [],
  categories: D.categories || [],
  settings: Object.assign({
    appName:'HeroGames', tagline:'أفضل الألعاب في مكان واحد',
    logoImage:'', logoEmoji:'🎮',
    primaryColor:'#F59E0B', bgColor:'#0F0F1A',
    featuredId:'', showDailyBonus:true
  }, D.settings || {})
};

var ACTIVE_CAT = 'all';
var SEARCH_TERM = '';

/* ============================================================
   THEME
   ============================================================ */
(function applyTheme(){
  var s = STATE.settings;
  var r = document.documentElement.style;
  if (s.primaryColor) r.setProperty('--primary', s.primaryColor);
  if (s.bgColor) r.setProperty('--bg', s.bgColor);
  document.title = s.appName || 'HeroGames';
  $('#app-name').textContent = s.appName || 'HeroGames';
  $('#splash-title').textContent = s.appName || 'HeroGames';
  $('#splash-tag').textContent = (s.tagline || '').toUpperCase();
  var logo = $('#app-logo'), splashMark = $('#splash-mark');
  if (s.logoImage){
    logo.innerHTML = '<img src="'+esc(s.logoImage)+'" alt="">';
    splashMark.innerHTML = '<img src="'+esc(s.logoImage)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:26px">';
  } else {
    logo.textContent = s.logoEmoji || '🎮';
    splashMark.textContent = s.logoEmoji || '🎮';
  }
})();

/* ============================================================
   CATEGORY HELPERS
   ============================================================ */
function catOf(id){
  for (var i=0;i<STATE.categories.length;i++) if (STATE.categories[i].id===id) return STATE.categories[i];
  return { id: id, name: id, icon: '🎮' };
}

/* ============================================================
   CARD BUILDERS
   ============================================================ */
function gameCardHTML(g){
  var cover = g.image
    ? '<img src="'+esc(g.image)+'" alt="" loading="lazy" onerror="this.remove()">'
    : '<span class="game-emoji">'+(g.emoji||'🎮')+'</span>';
  var badge = '';
  if (g.badge === 'new') badge = '<span class="game-badge new">جديد</span>';
  else if (g.badge === 'hot') badge = '<span class="game-badge hot">🔥 رائج</span>';
  var rating = Number(g.rating || 0).toFixed(1);
  var players = g.players || '';
  return '<article class="game-card" data-id="'+esc(g.id)+'">'+
    '<div class="game-cover" style="--c1:'+(g.c1||'#F59E0B')+';--c2:'+(g.c2||'#FBBF24')+'">'+
      badge + cover +
    '</div>'+
    '<div class="game-body">'+
      '<h3 class="game-title">'+esc(g.title)+'</h3>'+
      '<div class="game-stats">'+
        (rating !== '0.0' ? '<span><span class="star">★</span>'+rating+'</span>' : '') +
        (players ? '<span>👥 '+esc(players)+'</span>' : '') +
      '</div>'+
      '<button class="play-btn" data-play="'+esc(g.id)+'">▶ العب</button>'+
    '</div>'+
  '</article>';
}

function topCardHTML(g){
  var cover = g.image
    ? '<img src="'+esc(g.image)+'" alt="" loading="lazy" onerror="this.remove()">'
    : '<span class="game-emoji">'+(g.emoji||'🎮')+'</span>';
  return '<div class="top-card" data-id="'+esc(g.id)+'">'+
    '<div class="game-cover" style="--c1:'+(g.c1||'#F59E0B')+';--c2:'+(g.c2||'#FBBF24')+'">'+cover+'</div>'+
    '<div class="game-body">'+
      '<h3 class="game-title">'+esc(g.title)+'</h3>'+
      '<button class="play-btn" data-play="'+esc(g.id)+'">▶ العب</button>'+
    '</div>'+
  '</div>';
}

/* ============================================================
   RENDER: FEATURED HERO
   ============================================================ */
function renderFeatured(){
  var slot = $('#featured-slot');
  var feat = null;
  if (STATE.settings.featuredId){
    feat = STATE.games.filter(function(g){ return g.id === STATE.settings.featuredId; })[0];
  }
  if (!feat) feat = STATE.games.filter(function(g){ return g.featured; })[0];
  if (!feat && STATE.games.length) feat = STATE.games[0];

  if (!feat){
    slot.innerHTML = '';
    return;
  }

  var cover = feat.image
    ? '<img src="'+esc(feat.image)+'" alt="" onerror="this.remove()">'
    : '';
  var rating = Number(feat.rating || 0).toFixed(1);

  slot.innerHTML = '<div class="hero-featured" data-id="'+esc(feat.id)+'" style="--c1:'+(feat.c1||'#F59E0B')+';--c2:'+(feat.c2||'#FBBF24')+'">'+
    cover +
    '<div class="hero-badge">⭐ لعبة مميزة</div>'+
    '<div class="hero-info">'+
      '<h2 class="hero-title">'+esc(feat.title)+'</h2>'+
      '<div class="hero-meta">'+
        (rating !== '0.0' ? '<span>★ '+rating+'</span>' : '') +
        (feat.players ? '<span>👥 '+esc(feat.players)+'</span>' : '') +
        (feat.category ? '<span>'+catOf(feat.category).icon+' '+esc(catOf(feat.category).name)+'</span>' : '') +
      '</div>'+
      '<button class="hero-play" data-play="'+esc(feat.id)+'">▶ العب الآن</button>'+
    '</div>'+
  '</div>';
}

/* ============================================================
   RENDER: CATEGORIES
   ============================================================ */
function renderCats(){
  var html = '<button class="chip'+(ACTIVE_CAT==='all'?' active':'')+'" data-cat="all">🎮 الكل</button>';
  STATE.categories.forEach(function(c){
    html += '<button class="chip'+(ACTIVE_CAT===c.id?' active':'')+'" data-cat="'+esc(c.id)+'">'+c.icon+' '+esc(c.name)+'</button>';
  });
  $('#cats-slot').innerHTML = html;
}

/* ============================================================
   RENDER: TOP + ALL
   ============================================================ */
function renderTop(){
  var top = STATE.games.slice().sort(function(a,b){ return (b.rating||0) - (a.rating||0); }).slice(0,6);
  var slot = $('#top-slot');
  if (!top.length){ $('#top-section').hidden = true; return; }
  $('#top-section').hidden = false;
  slot.innerHTML = top.map(topCardHTML).join('');
}

function renderAll(){
  var list = STATE.games.filter(function(g){
    if (ACTIVE_CAT !== 'all' && g.category !== ACTIVE_CAT) return false;
    return true;
  });
  var slot = $('#games-slot');
  $('#games-count').textContent = list.length ? list.length+' لعبة' : '';
  if (!list.length){
    slot.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">🎮</div><h3>لا توجد ألعاب</h3><p>أضف ألعابك من لوحة التحكم</p></div>';
    return;
  }
  slot.innerHTML = list.map(gameCardHTML).join('');
}

/* ============================================================
   RENDER: SEARCH
   ============================================================ */
function renderSearch(){
  var t = SEARCH_TERM.trim().toLowerCase();
  if (!t){
    showView('home');
    return;
  }
  var list = STATE.games.filter(function(g){
    return (g.title + ' ' + (g.description||'') + ' ' + (g.tags||[]).join(' ')).toLowerCase().indexOf(t) !== -1;
  });
  $('#search-count').textContent = list.length ? list.length+' لعبة' : '';
  var slot = $('#search-slot');
  if (!list.length){
    slot.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">🔍</div><h3>لا نتائج</h3></div>';
  } else {
    slot.innerHTML = list.map(gameCardHTML).join('');
  }
}

/* ============================================================
   RENDER: GAME DETAIL
   ============================================================ */
function showGame(id){
  var g = STATE.games.filter(function(x){ return x.id === id; })[0];
  if (!g){ toast('اللعبة غير موجودة'); return; }
  document.title = g.title + ' — ' + (STATE.settings.appName||'HeroGames');
  var cover = g.image
    ? '<img src="'+esc(g.image)+'" alt="" onerror="this.remove()">'
    : '<span>'+esc(g.emoji||'🎮')+'</span>';
  var rating = Number(g.rating || 0).toFixed(1);
  var infoItems = [];
  if (g.size) infoItems.push(['الحجم', g.size]);
  if (g.version) infoItems.push(['الإصدار', g.version]);
  if (g.players) infoItems.push(['اللاعبون', g.players]);
  if (g.developer) infoItems.push(['المطوّر', g.developer]);

  $('#game-detail-slot').innerHTML =
    '<button class="back-btn" id="back-btn">← العودة</button>'+
    '<div class="game-detail">'+
      '<div class="detail-cover" style="--c1:'+(g.c1||'#F59E0B')+';--c2:'+(g.c2||'#FBBF24')+'">'+cover+'</div>'+
      '<h1 class="detail-title">'+esc(g.title)+'</h1>'+
      '<div class="detail-meta">'+
        (rating !== '0.0' ? '<span>★ '+rating+'</span>' : '') +
        (g.category ? '<span>'+catOf(g.category).icon+' '+esc(catOf(g.category).name)+'</span>' : '') +
        (g.players ? '<span>👥 '+esc(g.players)+'</span>' : '') +
      '</div>'+
      (g.description ? '<div class="detail-desc">'+esc(g.description)+'</div>' : '') +
      (infoItems.length ? '<div class="detail-info">' +
        infoItems.map(function(it){ return '<div class="info-item"><div class="lbl">'+esc(it[0])+'</div><div class="val">'+esc(it[1])+'</div></div>'; }).join('') +
      '</div>' : '') +
      '<button class="big-play" data-play="'+esc(g.id)+'">▶ العب الآن</button>'+
    '</div>';

  showView('game');
  var bb = $('#back-btn');
  if (bb) bb.addEventListener('click', function(){ history.back(); });
  window.scrollTo({ top:0, behavior:'auto' });
}

/* ============================================================
   PLAY ACTION
   ============================================================ */
function playGame(id){
  var g = STATE.games.filter(function(x){ return x.id === id; })[0];
  if (!g){ toast('اللعبة غير موجودة'); return; }
  if (g.url){
    toast('جاري فتح اللعبة...');
    setTimeout(function(){ window.open(g.url, '_blank', 'noopener'); }, 300);
  } else {
    toast('لم يُضف رابط للعبة بعد');
  }
}

/* ============================================================
   VIEWS + ROUTER
   ============================================================ */
function showView(name){
  ['home','search','game'].forEach(function(v){
    var el = document.getElementById('view-'+v);
    if (el) el.hidden = (v !== name);
  });
  $$('.nav-item').forEach(function(n){
    n.classList.toggle('active', n.dataset.nav === name || (name==='game' && n.dataset.nav==='home'));
  });
  window.scrollTo({ top:0, behavior:'auto' });
}

function route(){
  var h = location.hash || '#/';
  if (h.indexOf('#/game/') === 0){ showGame(h.substring('#/game/'.length)); return; }
  if (h === '#/search'){ renderSearch(); showView('search'); return; }
  if (h === '#/top'){ renderTop(); showView('home'); setTimeout(function(){ var s=$('#top-section'); if(s) s.scrollIntoView({behavior:'smooth'}); }, 50); return; }
  showView('home');
}

/* ============================================================
   EVENTS
   ============================================================ */
function bind(){
  /* Play buttons (delegated) */
  document.addEventListener('click', function(e){
    var pb = e.target.closest('[data-play]');
    if (pb){ e.stopPropagation(); playGame(pb.getAttribute('data-play')); return; }
    var card = e.target.closest('.game-card, .top-card, .hero-featured');
    if (card && card.dataset.id){ location.hash = '#/game/'+card.dataset.id; return; }
    var chip = e.target.closest('.chip');
    if (chip){ ACTIVE_CAT = chip.getAttribute('data-cat'); renderCats(); renderAll(); return; }
  });

  /* Nav */
  $$('.nav-item').forEach(function(n){
    n.addEventListener('click', function(){
      var v = n.dataset.nav;
      if (v === 'home') location.hash = '#/';
      else if (v === 'top') location.hash = '#/top';
      else if (v === 'search'){
        var bar = $('#search-bar');
        bar.classList.toggle('open');
        if (bar.classList.contains('open')) setTimeout(function(){ $('#search-input').focus(); }, 300);
        location.hash = '#/';
      }
    });
  });

  /* Search toggle */
  $('#search-btn').addEventListener('click', function(){
    var bar = $('#search-bar');
    bar.classList.toggle('open');
    if (bar.classList.contains('open')) setTimeout(function(){ $('#search-input').focus(); }, 300);
  });

  /* Search input */
  var st;
  $('#search-input').addEventListener('input', function(){
    clearTimeout(st);
    st = setTimeout(function(){
      SEARCH_TERM = this.value;
      if (!SEARCH_TERM.trim()){ location.hash = '#/'; return; }
      location.hash = '#/search';
      renderSearch();
      showView('search');
    }.bind(this), 200);
  });

  /* Hash change */
  window.addEventListener('hashchange', route);
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  renderFeatured();
  renderCats();
  renderTop();
  renderAll();
  bind();
  route();

  /* Hide splash */
  setTimeout(function(){ $('#splash').classList.add('hide'); }, 900);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
</body>
</html>

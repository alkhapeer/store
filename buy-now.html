<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شراء Trend Studio — HERO Store</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --primary:#6366F1; --primary-2:#A855F7; --bg:#F7F7FB; --text:#0F0F1A; --muted:#6B6B80; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 20px;
  }
  .container {
    background: #fff; max-width: 600px; width: 100%;
    border-radius: 24px; padding: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    border: 1px solid #ECECF4;
  }
  .back-link {
    display: inline-block; text-decoration: none; color: var(--muted);
    font-size: 14px; font-weight: 600; margin-bottom: 20px;
  }
  .back-link:hover { color: var(--primary); }
  .header { text-align: center; margin-bottom: 24px; }
  .header h1 { margin: 0 0 8px; font-size: 24px; font-weight: 800; }
  .header p { margin: 0; color: var(--muted); font-size: 15px; }
  .payment-wrapper {
    background: #F8F8FD; border-radius: 16px; padding: 20px;
    border: 1px solid #ECECF4; min-height: 400px;
  }
</style>
</head>
<body>

<div class="container">
  <a href="https://store.hero1.vip/" class="back-link">← العودة للمتجر</a>
  
  <div class="header">
    <h1>Hero Store</h1>
    <p>أمنتجات رقمية</p>
  </div>

  <div class="payment-wrapper">
    <!-- كود بوابة الدفع Daffaa كما هو -->
    <div>
      <script
        src="https://daffaa.net/embed/v1.js"
        data-daffaa-store="hero"
        data-amount="100"
        data-reference="TREND-STUDIO"
        data-height="600"
        async>
      </script>
    </div>
  </div>
</div>

</body>
</html>
